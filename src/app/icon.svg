<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Atlas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1e12"/>
      <stop offset="1" stop-color="#140d08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d488"/>
      <stop offset="0.55" stop-color="#eab308"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f3e3c3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- open book -->
  <path d="M32 21c-4-2.6-9-3.6-14-3v25c5-.6 10 .4 14 3z" fill="url(#page)"/>
  <path d="M32 21c4-2.6 9-3.6 14-3v25c-5-.6-10 .4-14 3z" fill="url(#page)" opacity=".88"/>
  <!-- pages rising off the spine -->
  <path d="M32 13c-3.2-1.7-6.6-2.3-9.5-1.9" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M32 13c3.2-1.7 6.6-2.3 9.5-1.9" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M32 7.5V13" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M32 21v25" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
</svg>
